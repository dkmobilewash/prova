# Answers one question about PRODUCTION and writes nothing.
#
# Issue #136 finding 1: the union tables carry no `companyId` and the only
# access check is a self-asserted `CompanyUnionAgreement`. Whether that is a
# live breach or a latent one depends on whether two companies have landed
# on the same local — and so does the fix, because a backfill can only be
# written once somebody knows.
#
# That question has been open since 2026-09-03 and has been asked in Slack
# three times. It stayed open because the only people who could answer it
# are the ones with `ep-little-sea` credentials, and answering meant pasting
# a connection string somewhere. This workflow removes that step: the
# credentials are already repository secrets, so the runner has them and
# nobody has to handle one.
#
# READ-ONLY BY CONSTRUCTION. The script issues three SELECTs. It takes no
# inputs, so there is nothing to inject, and the SQL is fixed in the file
# rather than assembled here. It prints the host it read, never the
# connection string.
name: Union tenancy audit (read-only)

on:
  workflow_dispatch:

# One at a time. Two concurrent runs would answer the same question twice
# and hold two connections against a `connection_limit=5` pool for nothing.
concurrency:
  group: union-tenancy-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Is the shared union namespace already shared?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fail early if the secret is missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL repository secret. Nothing was read."
            echo "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @prova/db exec prisma generate

      - name: Read
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/union-tenancy-audit.mjs
