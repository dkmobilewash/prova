# Applies database migrations when a PR merges to main.
#
# This used to live in the Vercel build. It moved here after a promoted
# preview revealed the hole: promoting reuses the preview's already-built
# output, so the build command never re-runs and its migrations never
# apply — a deployment could become production carrying code whose schema
# changes had never reached any database.
#
# Merging is the decision to change production. A build is not. So this
# runs on the merge, once, and verifies the result rather than trusting it.
#
# REQUIRED SECRETS — without both, this job fails loudly and migrations do
# not happen at all:
#   DATABASE_URL  the pooled Neon endpoint the app queries
#   DIRECT_URL    the DIRECT endpoint of that SAME Neon branch
# They must be the same database. The script refuses to run if they are
# not, which is the check that would have caught the drift that prompted
# this file: builds migrating one endpoint while both developers read
# another, for hours, with every log line reporting success.

name: Migrate

on:
  push:
    branches: [main]
  # Re-runnable by hand when a merge landed while the database was
  # unreachable — a Neon compute waking from idle can outlast the job.
  workflow_dispatch:

# Never let two merges migrate at once. Prisma takes an advisory lock, so
# the loser would fail rather than corrupt anything — but a failed migrate
# on main reads as a broken deploy and costs someone an hour.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fail early if the secrets are missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -e
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing DIRECT_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Migrations cannot run. Add them under Settings → Secrets and"
            echo "variables → Actions. DIRECT_URL must be the direct (non-pooler)"
            echo "endpoint of the SAME Neon branch DATABASE_URL points at."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Prints which database it is talking to, refuses to run if
      # DATABASE_URL and DIRECT_URL are different databases, applies, then
      # reads back `migrate status` to verify rather than trust.
      #
      # MIGRATE_EXPECT_HOST is the check that catches a secret holding the
      # WRONG connection string — everything else here only compares the two
      # URLs against each other, which stays happy if both point somewhere
      # nobody intended. Until now only migrate-demo.yml set it, so the demo
      # database was guarded against a wrong secret and PRODUCTION was not:
      # the weaker protection was on the real data. (Added 2026-09-03.)
      #
      # Hardcoded, not a secret, on purpose. It is an assertion about which
      # database this workflow is for, and its whole value is that a reviewer
      # can read it in the diff — CLAUDE.md publishes the same endpoint id.
      # `wrongTarget` substring-matches the host, so this one value covers
      # both the pooled and direct endpoints of that branch.
      #
      # If Neon ever moves production to a new endpoint, this job FAILS and
      # applies nothing until somebody changes this line. That is the correct
      # failure: loud, and in front of a person, rather than a silent migrate
      # against whatever the secret happens to hold.
      - name: Apply and verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          MIGRATE_EXPECT_HOST: ep-little-sea-a6bdnaw2
        run: pnpm --filter @prova/db run migrate:deploy
