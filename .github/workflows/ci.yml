name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Build-time only — no real database or Clerk connection is made by
  # `prisma generate`, `next lint`, `tsc --noEmit`, or a production build of
  # pages that don't prerender data. Real values live in Vercel/Neon.
  DATABASE_URL: "postgresql://user:password@localhost:5432/prova_ci"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
  CLERK_SECRET_KEY: "sk_test_dummydummydummydummydummydummydummydummy"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Runs before lint/typecheck/build because it is by far the fastest
      # signal here (~0.4s) and it is the only one that checks BEHAVIOUR
      # rather than shape. Lint, typecheck and a full build have all passed
      # over real defects in this repo — a reissued case number, a
      # same-day answer that was impossible, a superseded revision shown
      # as current. Those live in the derived-state and date logic these
      # tests cover.
      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Next's "Collecting build traces" step needs more than Node's
          # ~4 GB default old-space on this app, and dies with an OOM at the
          # very end of an otherwise successful build. It only shows up here:
          # Vercel's builders size the heap from machine memory, and a dev
          # machine with more RAM gets a bigger default too, so the build
          # passes locally and fails in CI.
          #
          # 4096 reproduces the failure, 6144 passes; 8192 leaves margin for
          # growth on a 16 GB runner. Raise it rather than trimming
          # outputFileTracingIncludes in next.config.mjs — that glob is what
          # gets Prisma's query-engine binary into the deployed function, and
          # dropping it breaks production at runtime, not at build time.
          NODE_OPTIONS: --max-old-space-size=8192

  # The 144 database tests that, until now, nothing ran.
  #
  # `vitest.db.config.ts` existed with a docstring explaining how to run it
  # by hand, and no runner referenced it — not this workflow, not
  # preflight.sh, not any package script. `vitest.config.mts` includes only
  # `**/*.test.ts`, so every `.dbtest.ts` was invisible to `pnpm test`.
  # Meanwhile three unit tests cite them as where the behaviour "is
  # proven": page-money-guards.test.ts points at permissions.dbtest.ts, and
  # export.test.ts leaves the tenant-scoping VALUE check to
  # export.dbtest.ts while itself only checking that a key named companyId
  # exists.
  #
  # Separate job, not another step in `ci`: these need Postgres, the unit
  # suite deliberately does not, and the fast signal should not wait on a
  # service container starting.
  dbtest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prova
          POSTGRES_PASSWORD: prova
          POSTGRES_DB: prova_dbtest
        ports: ["5432:5432"]
        # Without this the job races the container and fails on connect.
        options: >-
          --health-cmd "pg_isready -U prova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A scratch database that exists only for this job. The suite creates
      # and deletes companies, which is why its own docstring says never to
      # point it at a real one.
      DATABASE_URL: "postgresql://prova:prova@localhost:5432/prova_dbtest"
      DIRECT_URL: "postgresql://prova:prova@localhost:5432/prova_dbtest"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # `migrate deploy`, not `db push`: this asserts the committed
      # migrations actually build the schema the tests expect, which is a
      # second thing worth knowing on every PR.
      - name: Apply migrations to the scratch database
        run: pnpm --filter @prova/db exec prisma migrate deploy --schema prisma/schema

      - name: Database tests
        run: pnpm test:db
